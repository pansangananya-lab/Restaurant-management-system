<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodExpress - สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-bold text-orange-500">FoodExpress</span>
      </div>
      <div class="hidden md:flex flex-1 max-w-md mx-6">
        <input type="text" placeholder="ค้นหาเมนูอาหาร หรือร้านอร่อย..." 
               class="w-full px-4 py-2 border border-gray-200 rounded-full focus:outline-none focus:border-orange-500 text-sm">
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="toggleCart()" class="relative bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-full text-sm font-medium transition">
          ตะกร้า (<span id="cart-count">0</span>)
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-8 text-white flex flex-col md:flex-row items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold mb-2">หิวเมื่อไหร่ก็แวะมา ส่งไวทันใจ!</h1>
        <p class="text-orange-100 mb-4">รับส่วนลดค่าส่งฟรีเมื่อสั่งครบ 150 บาทขึ้นไป</p>
        <span class="bg-white text-orange-600 font-semibold px-4 py-1.5 rounded-lg text-sm">โค้ด: FREE150</span>
      </div>
    </div>
  </header>

  <!-- Categories -->
  <section class="max-w-6xl mx-auto px-4 mt-8">
    <h2 class="text-lg font-semibold mb-4">หมวดหมู่ยอดฮิต</h2>
    <div class="flex space-x-3 overflow-x-auto pb-2">
      <button class="px-4 py-2 bg-orange-500 text-white rounded-full text-sm font-medium shrink-0">ทั้งหมด</button>
      <button class="px-4 py-2 bg-white border border-gray-200 hover:border-orange-500 rounded-full text-sm shrink-0">อาหารตามสั่ง</button>
      <button class="px-4 py-2 bg-white border border-gray-200 hover:border-orange-500 rounded-full text-sm shrink-0">ก๋วยเตี๋ยว</button>
      <button class="px-4 py-2 bg-white border border-gray-200 hover:border-orange-500 rounded-full text-sm shrink-0">ชานม & กาแฟ</button>
      <button class="px-4 py-2 bg-white border border-gray-200 hover:border-orange-500 rounded-full text-sm shrink-0">ของหวาน</button>
    </div>
  </section>

  <!-- Menu Grid -->
  <main class="max-w-6xl mx-auto px-4 mt-8 mb-16">
    <h2 class="text-lg font-semibold mb-4">เมนูแนะนำวันนี้</h2>
    <div id="menu-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- รายการอาหารจะถูกสร้างด้วย JS -->
    </div>
  </main>

  <!-- Cart Drawer (Slide-over) -->
  <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h3 class="text-lg font-bold">ตะกร้าสินค้าของคุณ</h3>
          <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <div id="cart-items" class="mt-4 space-y-4 max-h-96 overflow-y-auto">
          <p class="text-gray-400 text-sm text-center py-8">ยังไม่มีรายการอาหารในตะกร้า</p>
        </div>
      </div>
      <div class="border-t pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>ยอดรวมทั้งหมด</span>
          <span class="text-orange-500"><span id="cart-total">0</span> ฿</span>
        </div>
        <button onclick="checkout()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">
          ดำเนินการสั่งซื้อ
        </button>
      </div>
    </div>
  </div>

  <script>
    const menus = [
      { id: 1, name: "ข้าวกะเพราหมูสับไข่ดาว", price: 65, shop: "ครัวป้าณี ตามสั่ง", img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=400&q=80" },
      { id: 2, name: "ก๋วยเตี๋ยวเรือเนื้อวากิว", price: 89, shop: "เตี๋ยวเรือรสเด็ด", img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400&q=80" },
      { id: 3, name: "ชานมไข่มุกบราวน์ชูการ์", price: 45, shop: "Cha-Time Cafe", img: "https://images.unsplash.com/photo-1558857563-b371033873b8?w=400&q=80" },
      { id: 4, name: "ไก่ทอดเกาหลีซอสการ์ลิค", price: 129, shop: "Seoul Chicken", img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400&q=80" }
    ];

    let cart = [];

    function renderMenus() {
      const container = document.getElementById('menu-list');
      container.innerHTML = menus.map(item => `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 hover:shadow-md transition">
          <img src="${item.img}" alt="${item.name}" class="w-full h-44 object-cover">
          <div class="p-4">
            <span class="text-xs text-gray-400">${item.shop}</span>
            <h3 class="font-semibold text-gray-800 mt-1">${item.name}</h3>
            <div class="flex justify-between items-center mt-4">
              <span class="font-bold text-orange-500">${item.price} ฿</span>
              <button onclick="addToCart(${item.id})" class="bg-orange-100 hover:bg-orange-500 text-orange-600 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
                + เพิ่ม
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menus.find(m => m.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const itemsEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      countEl.innerText = totalQty;
      totalEl.innerText = totalPrice;

      if (cart.length === 0) {
        itemsEl.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">ยังไม่มีรายการอาหารในตะกร้า</p>';
      } else {
        itemsEl.innerHTML = cart.map(item => `
          <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
            <div>
              <h4 class="font-medium text-sm">${item.name}</h4>
              <span class="text-xs text-orange-500">${item.price} ฿ x ${item.qty}</span>
            </div>
            <span class="font-semibold text-sm">${item.price * item.qty} ฿</span>
          </div>
        `).join('');
      }
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      drawer.classList.toggle('hidden');
      drawer.classList.toggle('flex');
    }

    function checkout() {
      if (cart.length === 0) return alert('กรุณาเลือกอาหารก่อนสั่งซื้อ');
      alert('สั่งซื้อสำเร็จ! กำลังส่งข้อมูลไปยังร้านค้า');
      cart = [];
      updateCartUI();
      toggleCart();
    }


  </script>
</body>
</html>
